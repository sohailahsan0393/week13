name: wf
on: 
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
jobs:
  linting-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome step 
        run: echo "something"
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install htmlhint and stylelint
        run: |
          npm install --save-dev htmlhint stylelint
      - name: Lint HTML files
        run: npx htmlhint "**/*.html"
      - name: Lint CSS files
        run: npx stylelint "**/*.css"
